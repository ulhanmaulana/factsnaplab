<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Login selesai</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><div class="logo">FL</div><div><strong>Factsnap Lab</strong><div class="muted">Uploader</div></div></header>
<h1 id="title">Login selesai</h1>
<p id="msg">Salin alamat di bawah ini lalu kirim ke asisten Anda (kode ini sekali pakai dan berlaku beberapa menit).</p>
<div class="card"><code id="url" style="word-break:break-all"></code></div>
<p><button id="copy" style="font:inherit;padding:10px 18px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer">Salin alamat</button> <span id="ok" class="muted"></span></p>
<p class="muted">Halaman ini tidak mengirim data ke mana pun; alamat hanya ditampilkan di browser Anda.</p>
</main>
<script>
  const href = location.href;
  document.getElementById('url').textContent = href;
  const q = new URLSearchParams(location.search);
  if (q.get('error')) { document.getElementById('title').textContent = 'Login dibatalkan / gagal'; document.getElementById('msg').textContent = 'Kirim alamat ini juga supaya penyebabnya bisa dicek.'; }
  if (!q.get('code') && !q.get('error')) { document.getElementById('title').textContent = 'Halaman callback'; document.getElementById('msg').textContent = 'Halaman ini dipakai setelah login TikTok.'; }
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(href); document.getElementById('ok').textContent = 'Tersalin ✓'; }
    catch { document.getElementById('ok').textContent = 'Salin manual dari kotak di atas.'; }
  };
</script>
</body></html>
